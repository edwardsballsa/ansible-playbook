---
- name: Cisco Firmware Update Workflow
  hosts: cisco_switches
  gather_facts: false
  become: true
  tasks:
    - name: Run Pre-Upgrade Checks
      include_role:
        name: cisco_pre_check

    - name: Execute Firmware Upgrade (Verified Playbook)
      include_role: cisco_firmware_updates

    - name: Run Post-Upgrade Checks
      include_role:
        name: cisco_post_check

    - name: Send Email Notification if Differences Found
      include_role:
        name: email
      vars:
        email_addresses_list:
          - admin@example.com
        email_subject: "Firmware Update Report: {{ inventory_hostname }}"
        email_body: "{{ diff_report }}"
      when: has_diff | default(false)
