---
- name: Gather final switch facts
  cisco.ios.ios_facts:
    gather_subset: hardware

- name: Ensure local backup directory exists for this host
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: Capture Critical Network State (Post-Check)
  cisco.ios.ios_command:
    commands: "{{ critical_network_commands }}"
  register: network_state_post
  become: true
  become_method: ansible.netcommon.enable

- name: Save post-upgrade network state to local files
  ansible.builtin.copy:
    content: "{{ item.1 }}"
    dest: "{{ backup_dir }}/POST_{{ item.0 | replace(' ', '_') }}.txt"
    mode: '0644'
  delegate_to: localhost
  loop: "{{ critical_network_commands | zip(network_state_post.stdout) | list }}"

- name: Compare Pre and Post State
  set_fact:
    diff_report: |
      Network State Comparison for {{ inventory_hostname }}:
      --------------------------------------------------
      {% for cmd in critical_network_commands %}
      Command: {{ cmd }}
      {% set pre_file = backup_dir ~ '/' ~ (cmd | replace(' ', '_')) ~ '.txt' %}
      {% set post_file = backup_dir ~ '/POST_' ~ (cmd | replace(' ', '_')) ~ '.txt' %}
      {% if pre_file is exists and post_file is exists %}
        {% set pre_lines = lookup('file', pre_file).splitlines() | map('trim') | list %}
        {% set post_lines = lookup('file', post_file).splitlines() | map('trim') | list %}
        {% set missing = pre_lines | difference(post_lines) %}
        {% set added = post_lines | difference(pre_lines) %}
        {% if missing | length > 0 %}
          [MISSING]:
          {{ missing | join('\n') }}
        {% endif %}
        {% if added | length > 0 %}
          [ADDED]:
          {{ added | join('\n') }}
        {% endif %}
        {% if missing | length == 0 and added | length == 0 %}
          No changes detected.
        {% endif %}
      {% else %}
        Could not find pre or post file for comparison.
      {% endif %}
      --------------------------------------------------
      {% endfor %}
  delegate_to: localhost

- name: Set diff flag
  set_fact:
    has_diff: "{{ 'No changes detected' not in diff_report and 'Could not find' not in diff_report }}"

- name: Run additional verification commands
  ansible.netcommon.cli_command:
    command: "{{ item }}"
  loop: "{{ show_commands }}"
  register: command_results_post
  become: true
  become_method: ansible.netcommon.enable
  ignore_errors: true

- name: Save post-upgrade verification outputs
  ansible.builtin.copy:
    content: "{{ item.stdout }}"
    dest: "{{ backup_dir }}/POST_{{ item.item | replace(' ', '_') }}.txt"
    mode: '0644'
  delegate_to: localhost
  loop: "{{ command_results_post.results }}"
  when: item.failed is not defined or not item.failed
