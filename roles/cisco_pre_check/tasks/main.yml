---
- name: Gather initial switch facts
  cisco.ios.ios_facts:
    gather_subset: hardware

- name: Ensure local backup directory exists for this host
  ansible.builtin.file:
    path: "{{ backup_dir }}/{{ inventory_hostname }}"
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: Capture Critical Network State
  cisco.ios.ios_command:
    commands:
      - "show interfaces status"
      - "show interfaces description"
      - "show mac address-table"
      - "show cdp neighbors"
  register: network_state
  become: true
  become_method: ansible.netcommon.enable

- name: Save network state to local files
  ansible.builtin.copy:
    content: "{{ item.1 }}"
    dest: "{{ backup_dir }}/{{ inventory_hostname }}/{{ item.0 | replace(' ', '_') }}.txt"
    mode: '0644'
  delegate_to: localhost
  loop: "{{ ['show interfaces status', 'show interfaces description', 'show mac address-table', 'show cdp neighbors'] | zip(network_state.stdout) | list }}"

- name: Run additional verification commands
  ansible.netcommon.cli_command:
    command: "{{ item }}"
  loop: "{{ show_commands }}"
  register: command_results
  become: true
  become_method: ansible.netcommon.enable
  ignore_errors: true

- name: Save verification outputs to local files
  ansible.builtin.copy:
    content: "{{ item.stdout }}"
    dest: "{{ backup_dir }}/{{ inventory_hostname }}/{{ item.item | replace(' ', '_') }}.txt"
    mode: '0644'
  delegate_to: localhost
  loop: "{{ command_results.results }}"
  when: item.failed is not defined or not item.failed
