---
- name: Gather initial switch facts
  cisco.ios.ios_facts:
    gather_subset: hardware

- name: Show the model and version of Cisco Switch
  ansible.builtin.debug:
    msg:
      - "Deviec model: {{ ansible_net_model }}"
      - "Current Version: {{ ansible_net_version }}"
      - "Stacked model: {{ ansible_net_stacked_models }}"

- name: Run verification commands on Cisco switch
  ansible.netcommon.cli_command:
    command: "{{ item }}"
  loop: "{{ show_commands }}"
  register: command_results
  become: true
  become_method: ansible.netcommon.enable
  ignore_errors: true  # <--- 1. run next command if current one is failed

- name: Ensure local backup directory exists
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: Save command outputs to local files
  ansible.builtin.copy:
    content: "{{ item.stdout }}"
    dest: "{{ backup_dir }}/{{ item.item | replace(' ', '_') }}.txt"
    mode: '0644'
  delegate_to: localhost
  loop: "{{ command_results.results }}"
  # <--- 2. Save the sucessful command result and skip the failed one.
  when: item.failed is not defined or not item.failed
  loop_control:
    label: "Saving output of: {{ item.item }}"
