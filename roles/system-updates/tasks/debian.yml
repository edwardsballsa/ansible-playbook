---
# Debian/Ubuntu specific updates
- name: Gather package facts (Debian)
  ansible.builtin.package_facts:
    manager: auto
  when: ansible_network_os is not defined
  tags: [always]

- name: Update apt cache (Debian) - CHECK MODE
  ansible.builtin.apt:
    update_cache: yes
  when:
    - ansible_network_os is not defined
    - not run_update | bool
  tags: [check]

- name: Check for upgradable packages (Debian) - CHECK MODE
  ansible.builtin.shell: apt-get -s dist-upgrade | grep '^Inst'
  register: debian_upgradable
  changed_when: false
  failed_when: false
  when:
    - ansible_network_os is not defined
    - not run_update | bool
  tags: [check]

- name: Update apt cache (Debian) - APPLY MODE
  ansible.builtin.apt:
    update_cache: yes
  when:
    - ansible_network_os is not defined
    - run_update | bool
  tags: [apply]

- name: Upgrade all packages (Debian) - APPLY MODE
  ansible.builtin.shell: LC_ALL=C DEBIAN_FRONTEND=noninteractive apt-get dist-upgrade -y
  register: debian_upgrade_result
  failed_when: debian_upgrade_result.rc != 0
  changed_when:
    - debian_upgrade_result.rc == 0
    - "debian_upgrade_result.stdout is search('[1-9][0-9]* upgraded') or debian_upgrade_result.stdout is search('[1-9][0-9]* newly installed')"
  when:
    - ansible_network_os is not defined
    - run_update | bool
  tags: [apply]

- name: Check if reboot required (Debian)
  ansible.builtin.shell: |
    if [ -f /var/run/reboot-required ]; then
      exit 0
    fi
    latest_kernel="$(ls -1 /boot/vmlinuz-* 2>/dev/null | sed 's|.*/vmlinuz-||' | sort -V | tail -1)"
    running_kernel="$(uname -r)"
    if [ -n "$latest_kernel" ] && [ "$latest_kernel" != "$running_kernel" ]; then
      exit 0
    fi
    exit 1
  register: debian_reboot_check
  changed_when: false
  failed_when: false
  when:
    - ansible_network_os is not defined
    - run_update | bool or reboot_check | bool
  tags: [reboot_check]
