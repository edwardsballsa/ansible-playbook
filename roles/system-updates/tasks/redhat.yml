--- 
# RedHat/CentOS/Rocky/Alma specific updates
- name: Check for upgradable packages (RedHat) - CHECK MODE
  ansible.builtin.command: dnf -q check-update
  register: redhat_upgradable
  changed_when: false
  # dnf check-update exit codes (man dnf): 0 = no updates, 100 = updates available
  # (package list printed), 1 = error. Any other rc is a real dnf failure and must
  # fail loudly instead of being misread as "updates available".
  failed_when: redhat_upgradable.rc not in [0, 100]
  when:
    - ansible_network_os is not defined
    - not run_update | bool
  tags: [check]

- name: Update package cache (RedHat) - APPLY MODE
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: yes
  register: redhat_upgrade_result
  when:
    - ansible_network_os is not defined
    - run_update | bool
  tags: [apply]

- name: Check if reboot required (RedHat)
  ansible.builtin.command: needs-restarting -r
  register: redhat_reboot_check
  changed_when: false
  failed_when: false
  when:
    - ansible_network_os is not defined
    - run_update | bool or reboot_check | bool
  tags: [reboot_check]
