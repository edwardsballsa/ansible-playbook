---
# System Updates Role - Main Entry Point
# This role delegates tasks to OS-specific files based on ansible_os_family

- name: Include Debian updates
  ansible.builtin.import_tasks: debian.yml
  when: ansible_os_family == "Debian"

- name: Include Alpine updates
  ansible.builtin.import_tasks: alpine.yml
  when: ansible_os_family == "Alpine"

- name: Include RedHat updates
  ansible.builtin.import_tasks: redhat.yml
  when: ansible_os_family == "RedHat"

- name: Include Windows updates
  ansible.builtin.import_tasks: windows.yml
  when: ansible_os_family == "Windows"

- name: Compile upgrade summary (CHECK MODE)
  ansible.builtin.set_fact:
    upgrade_summary: |
      {{ ansible_facts.hostname | default(inventory_hostname) }} ({{ ansible_os_family }}):
      {% if ansible_os_family == "Debian" %}{{ debian_upgradable.stdout | replace('Listing...', '') | trim | default('No upgradable packages', true) }}
      {% elif ansible_os_family == "Alpine" %}{{ alpine_upgradable.stdout | replace('Listing...', '') | trim | default('No upgradable packages', true) }}
      {% elif ansible_os_family == "RedHat" %}{{ redhat_upgradable.stdout | trim | default('No upgradable packages', true) }}
      {% elif ansible_os_family == "Windows" %}{{ windows_update_search.updates | length | string }} updates available
      {% else %}Unsupported OS family{% endif %}
  when: not run_update | bool
  tags: [check]

- name: Compile upgrade result summary (APPLY MODE)
  ansible.builtin.set_fact:
    upgrade_summary: |
      {{ ansible_facts.hostname | default(inventory_hostname) }} ({{ ansible_os_family }}):
      {% if ansible_os_family == "Debian" %}{{ debian_upgrade_result.changed | ternary('Packages upgraded', 'No packages upgraded') }}
      {% elif ansible_os_family == "Alpine" %}{{ alpine_upgrade_result.changed | ternary('Packages upgraded', 'No packages upgraded') }}
      {% elif ansible_os_family == "RedHat" %}{{ redhat_upgrade_result.changed | ternary('Packages upgraded', 'No packages upgraded') }}
      {% elif ansible_os_family == "Windows" %}{{ windows_upgrade_result.updates | length | string }} updates installed
      {% else %}Unsupported OS family{% endif %}
  when: run_update | bool
  tags: [apply]

- name: Compile reboot status
  ansible.builtin.set_fact:
    reboot_required: >
      {% if ansible_os_family == "Debian" %}{{ debian_reboot_check.rc == 0 }}
      {% elif ansible_os_family == "Alpine" %}{{ alpine_reboot_check.rc == 0 }}
      {% elif ansible_os_family == "RedHat" %}{{ redhat_reboot_check.rc == 0 }}
      {% elif ansible_os_family == "Windows" %}{{ windows_reboot_check.exists | default(false) }}
      {% else %}false{% endif %}
  when: run_update | bool or reboot_check | bool
  tags: [reboot_check]

- name: Output summary
  ansible.builtin.debug:
    msg: "{{ upgrade_summary }}"
  when: upgrade_summary is defined
  tags: [check, apply]

- name: Output reboot status
  ansible.builtin.debug:
    msg: "Reboot required: {{ reboot_required | default(false) }}"
  when: reboot_required is defined
  tags: [reboot_check]
