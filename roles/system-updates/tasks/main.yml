---
- name: System Update for Debian/Ubuntu
  apt:
    update_cache: yes
    upgrade: dist
  when: ansible_os_family == "Debian" and ansible_network_os is not defined

- name: Update package cache and upgrade all packages on Alpine Linux
  community.general.apk:
    update_cache: yes
    upgrade: yes
  when: ansible_os_family == "Alpine" and ansible_network_os is not defined

- name: System Update for RHEL/CentOS/Rocky/Alma
  dnf:
    name: "*"
    state: latest
  when: ansible_os_family == "RedHat" and ansible_network_os is not defined

- name: System Update for Windows
  win_updates:
    category_uploaded: ['SecurityUpdates', 'CriticalUpdates', 'Updates']
    state: installed
  when: ansible_os_family == "Windows" and ansible_network_os is not defined
