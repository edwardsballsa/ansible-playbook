---
# tasks/pre_check.yml
- name: Get MAC address table
  cisco.ios.ios_command:
    commands:
      - show mac address-table dynamic
  register: mac_table_pre

- name: Store pre-upgrade snapshot locally
  copy:
    content: "{{ mac_table_pre.stdout[0] }}"
    dest: "/tmp/pre_upgrade_mac_{{ inventory_hostname }}.txt"
  delegate_to: localhost
