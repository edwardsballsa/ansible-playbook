name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./ansible-playbook

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 192.168.144.160 192.168.144.159 192.168.144.31 172.16.168.3 172.16.168.4 172.16.168.29 172.16.168.19 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Install collections
        run: |
          if [ -f requirements.yml ]; then
            ansible-galaxy collection install -r requirements.yml --ignore-certs
          fi

      - name: Deploy system updates (apply mode)
        run: |
          ansible-playbook system_update.yml -i inventory.ini --limit "hkexpress_test,pve,container,almalinux" -e "RUN_UPDATE=true" -e "REBOOT_CHECK=true" -e "ansible_user=${{ secrets.ANSIBLE_SSH_USER || 'hermes' }}"
        continue-on-error: false

      - name: Run WiFi status check
        run: |
          ansible-playbook wifi_status_check.yml -i inventory.ini --limit wifi -e "ansible_user=${{ secrets.ANSIBLE_SSH_USER || 'hermes' }}"
        continue-on-error: false

      - name: Create release tag
        if: success()
        id: create_release
        run: |
          TAG="v$(date +%Y%m%d-%H%M)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create_release.outputs.tag }}
          name: Release ${{ steps.create_release.outputs.tag }}
          generate_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify result
    if: always()
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.deploy-prod.result }}" == "success" ]; then
            echo "Production Deployment SUCCESS"
            echo "Release: ${{ steps.create_release.outputs.tag }}"
          else
            echo "Production Deployment FAILED"
            echo "Check Actions tab for details"
          fi