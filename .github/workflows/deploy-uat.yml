name: Deploy to UAT

on:
  push:
    branches: [uat]
  workflow_dispatch:

jobs:
  deploy-uat:
    name: Deploy to UAT Environment
    runs-on: ubuntu-latest
    environment: uat
    defaults:
      run:
        working-directory: ./ansible-playbook

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 192.168.144.160 192.168.144.159 192.168.144.31 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Install collections
        run: |
          if [ -f requirements.yml ]; then
            ansible-galaxy collection install -r requirements.yml --ignore-certs
          fi

      - name: Deploy system updates (check mode)
        run: |
          ansible-playbook system_update.yml -i inventory.ini --limit hkexpress_test -e "RUN_UPDATE=false" -e "REBOOT_CHECK=true" -e "ansible_user=${{ secrets.ANSIBLE_SSH_USER || 'hermes' }}"
        continue-on-error: false

      - name: Run WiFi status check
        run: |
          ansible-playbook wifi_status_check.yml -i inventory.ini --limit wifi -e "ansible_user=${{ secrets.ANSIBLE_SSH_USER || 'hermes' }}"
        continue-on-error: false

      - name: Verify deployment
        run: |
          echo "UAT deployment completed successfully"
          echo "Run manual tests against UAT environment"

  notify:
    name: Notify result
    if: always()
    needs: deploy-uat
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.deploy-uat.result }}" == "success" ]; then
            echo "UAT Deployment SUCCESS"
          else
            echo "UAT Deployment FAILED"
            echo "Check Actions tab for details"
          fi